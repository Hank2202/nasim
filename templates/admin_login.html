{% extends "base.html" %}

{% block title %}The Summit of Realms - Facilitator Command Deck{% endblock %}

{% block content %}
<div class="container" style="max-width: 480px; margin-top: 40px; text-align: center;">

  <div style="margin-bottom: 24px;">
    <span class="eyebrow">Facilitators only</span>
    <h1 class="page-title" style="margin-top: 10px;">Facilitator Command Deck</h1>
    <p class="lede" style="margin-top: 4px;">Enter the facilitator passcode to control the summit.</p>
  </div>

  <div class="card" style="text-align: left; background: var(--bg-surface-raised); border: 1px solid var(--border-strong); padding: 24px;">
    <div style="margin-bottom: 18px;">
      <label for="admin-passcode" class="form-label">
        Facilitator Master Passcode
      </label>
      <input type="password" id="admin-passcode" class="form-input mono" placeholder="Enter master passcode" autofocus autocomplete="current-password" style="font-size: 1rem; padding: 12px 14px;">
    </div>

    <div id="login-error" class="callout danger" style="display: none; margin-bottom: 16px;">
    </div>

    <button id="unlock-btn" class="btn btn-primary btn-block" onclick="submitAdminLogin()" style="padding: 12px; font-size: 0.95rem; font-weight: 800;">
      Unlock Command Deck &rarr;
    </button>

    <div style="margin-top: 18px; text-align: center; border-top: 1px solid var(--border-subtle); padding-top: 14px; display: flex; justify-content: space-between; font-size: 0.8rem;">
      <a href="/" style="color: var(--text-secondary); text-decoration: none;">&larr; Return to Lobby</a>
      <a href="/overview" style="color: var(--text-secondary); text-decoration: none;">Simulation Guide</a>
    </div>
  </div>

</div>

<script>
async function submitAdminLogin() {
  const passcode = document.getElementById('admin-passcode').value.trim();
  const errorBox = document.getElementById('login-error');
  const btn = document.getElementById('unlock-btn');

  if (!passcode) {
    errorBox.innerText = 'Please enter the facilitator master passcode.';
    errorBox.style.display = 'block';
    return;
  }

  btn.disabled = true;
  btn.innerText = 'Verifying Passcode...';
  errorBox.style.display = 'none';

  try {
    const res = await fetch('/api/auth/admin', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ passcode: passcode })
    });
    const data = await res.json();

    if (res.ok && data.success) {
      window.location.href = '/admin';
    } else {
      errorBox.innerText = data.message || data.error || 'Access denied: Invalid facilitator passcode.';
      errorBox.style.display = 'block';
      btn.disabled = false;
      btn.innerText = 'Unlock Command Deck \u2192';
    }
  } catch (err) {
    errorBox.innerText = 'Network error while attempting authentication.';
    errorBox.style.display = 'block';
    btn.disabled = false;
    btn.innerText = 'Unlock Command Deck \u2192';
  }
}

document.getElementById('admin-passcode').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') {
    submitAdminLogin();
  }
});
</script>
{% endblock %}
